services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: document_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d document_search"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://search:search@postgres:5432/document_search
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: "100"
      CACHE_TTL_SECONDS: "45"
      INDEX_STREAM: index.document
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "app.worker.indexer"]
    environment:
      DATABASE_URL: postgresql+asyncpg://search:search@postgres:5432/document_search
      REDIS_URL: redis://redis:6379/0
      INDEX_STREAM: index.document
      INDEX_GROUP: indexers
      INDEX_CONSUMER: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
